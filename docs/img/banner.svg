<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">ServiceNow MCP Gateway</title>
  <desc id="d">Your ServiceNow, as MCP tools for Claude, Cursor, Copilot or any MCP client.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B5E3F"/>
      <stop offset="0.5" stop-color="#143F2C"/>
      <stop offset="1" stop-color="#0B241A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#5BD08C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5BD08C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E8B57"/>
      <stop offset="1" stop-color="#1B5E3F"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>

    <!-- network constellation (right) -->
    <g stroke="#5BD08C" stroke-opacity="0.25" stroke-width="1.5" fill="none">
      <path d="M1135 48 L1200 112 L1252 64"/>
      <path d="M1200 112 L1165 222 L1238 292"/>
      <path d="M1165 222 L1102 314"/>
    </g>
    <g fill="#5BD08C" fill-opacity="0.4">
      <circle cx="1135" cy="48" r="5"/>
      <circle cx="1200" cy="112" r="7"/>
      <circle cx="1252" cy="64" r="4"/>
      <circle cx="1165" cy="222" r="6"/>
      <circle cx="1238" cy="292" r="4"/>
      <circle cx="1102" cy="314" r="4"/>
    </g>

    <!-- logo mark: same shield-check tile as the website -->
    <g transform="translate(80 92)">
      <rect width="176" height="176" rx="44" fill="url(#mark)"/>
      <rect x="1.5" y="1.5" width="173" height="173" rx="42.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
      <g transform="translate(36 36) scale(4.33)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 4 6v6c0 5 3.5 8 8 10 4.5-2 8-5 8-10V6z"/>
        <path d="M9 12l2 2 4-4"/>
      </g>
    </g>

    <!-- wordmark -->
    <g font-family="'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="300" y="148" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-1.5">ServiceNow <tspan fill="#5BD08C">MCP</tspan> Gateway</text>
      <text x="302" y="194" font-size="26" font-weight="700" fill="#5BD08C">Your ServiceNow, as MCP tools for Claude</text>
    </g>
    <g font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="302" y="232" font-size="19" fill="#B9D6C2">Claude, Cursor, Copilot, Gemini CLI or any MCP client · no-code tools · interactive MCP Apps</text>

      <!-- pills -->
      <g font-size="16" font-weight="600">
        <rect x="302" y="258" width="150" height="36" rx="18" fill="#0B241A" stroke="#5BD08C" stroke-opacity="0.45"/>
        <text x="377" y="282" text-anchor="middle" fill="#5BD08C">npx · 1 command</text>

        <rect x="466" y="258" width="146" height="36" rx="18" fill="#0B241A" stroke="#5BD08C" stroke-opacity="0.45"/>
        <text x="539" y="282" text-anchor="middle" fill="#5BD08C">No-code tools</text>

        <rect x="626" y="258" width="132" height="36" rx="18" fill="#0B241A" stroke="#5BD08C" stroke-opacity="0.45"/>
        <text x="692" y="282" text-anchor="middle" fill="#5BD08C">MCP Apps UI</text>

        <rect x="772" y="258" width="214" height="36" rx="18" fill="#0B241A" stroke="#E8590C" stroke-opacity="0.75"/>
        <text x="879" y="282" text-anchor="middle" fill="#FF8A4C">OAuth · audit · rate limits</text>
      </g>
    </g>
  </g>
</svg>
